[project]
name = "inside-the-paintbox-backend"
version = "1.0.0"
description = "LangGraph chat agent backend for Inside the Paintbox"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "slowapi==0.1.9",
    "uvicorn==0.27.0",
    "chromadb==1.4.1",
    "voyageai==0.5.0",
    "pillow==10.4.0",
    "beautifulsoup4==4.12.3",
    "python-dotenv==1.0.0",
    "langgraph>=1.0.0",
    "langgraph-prebuilt>=1.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langsmith>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501 (line too long): several tool descriptions and system prompts are
# natural-language content that reads worse hard-wrapped than left alone.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# app.py imports several of its own modules after calling load_dotenv() -
# deliberate, since those modules read env vars at import time.
"app.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
