        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
        <link href="../css/Contact.css" type="text/css" rel="stylesheet">
        <link href="../css/Chat.css" type="text/css" rel="stylesheet">
    </head>
    <header>
      <div class="navbar">
            <div class="dropdown">
                <a class="dropbtn">Series
                </a>
                <div class="dropdown-content">
                  <a href="series/Portraits.html">Portraits</a>
                  <a href="series/portraits-animals.html">Animal Portraits</a>
                  <a href="series/Mythical.html">Mythical</a>

            <a class="btn-transperent" href="../Index.html" id='active'>Home</a>
              <a class="btn-transperent" href="about.html">About us</a>
            </div>
    </header>
<main>
<form name="commission" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="thank.html">
<input type="hidden" name="form-name" value="commission">
<input type="hidden" name="bot-field">


<label for="name">Name</label>
<input type="text" id="name" name="name" placeholder="Your name" required>

<label for="email">Email</label>
<input type="email" id="email" name="email" placeholder="Your email address" required>

<label for="phone">Phone (Optional)</label>
<input type="text" id="phone" name="phone" placeholder="Your phone number">

<label for="portrait-type">Type of Portrait</label>
<select id="portrait-type" name="portrait-type" required>
<option value="" disabled selected>Select a type</option>
<option value="human">Human Portrait</option>
<option value="animal">Animal Portrait</option>
<option value="couple">Couple / Group Portrait</option>
<option value="memorial">Memorial Portrait</option>
<option value="other">Other</option>
</select>

<label for="medium">Preferred Medium</label>
<select id="medium" name="medium" required>
<option value="" disabled selected>Select a medium</option>
<option value="acrylic">Acrylic on Canvas</option>
<option value="oil">Oil on Canvas</option>
<option value="watercolor">Watercolor</option>
<option value="digital">Digital Art</option>
<option value="pencil">Pencil / Graphite</option>
<option value="unsure">Not Sure - Need Guidance</option>
</select>

<label for="size">Preferred Size</label>
<select id="size" name="size" required>
<option value="" disabled selected>Select a size</option>
<option value="small">Small (8x10 inches)</option>
<option value="medium">Medium (12x16 inches)</option>
<option value="large">Large (18x24 inches)</option>
<option value="xlarge">Extra Large (24x36 inches)</option>
<option value="custom">Custom Size</option>
</select>

<label for="timeline">Timeline</label>
<select id="timeline" name="timeline">
<option value="" disabled selected>When do you need it?</option>
<option value="flexible">Flexible</option>
<option value="1month">Within 1 Month</option>
<option value="2months">Within 2 Months</option>
<option value="3months">Within 3 Months</option>
<option value="gift">For a Special Occasion (Please specify in message)</option>
</select>

<label for="reference">Reference Photo Link (Optional)</label>
<input type="text" id="reference" name="reference" placeholder="Google Drive, Dropbox, or image URL">

<label for="message">Tell me about your vision</label>
<textarea id="message" name="message" placeholder="Describe what you'd like - any specific poses, backgrounds, style preferences, or special details you want included..." style="height:200px" required></textarea>

<input type="submit" value="Submit Enquiry">
</form>

<br>
<div class="icon-bar" align="middle">
<a href="mailto:inthepaintbox@gmail.com"><i class="fa fa-envelope"></i></a>
<a href="https://www.instagram.com/ragini_chatterjee/"><i class="fa fa-instagram"></i></a>
</div>
</main>

<script>
    // Ensure redirect to thank you page after form submission
    document.querySelector('form[name="commission"]').addEventListener('submit', function() {
        setTimeout(function() {
            window.location.href = 'thank.html';
        }, 100);
    });
</script>
</body>
</html>
